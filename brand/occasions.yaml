# Saudi occasions calendar: the SEED (generic, not personal, so it lives in the public brand/ folder).
# A brand pack can ship its own occasions.yaml (brand_dir wins over this file).
#
# The seed is copied into the engine's DB (`reel calendar seed`, also on every job start). After that the
# DB is the source of truth: edits from the dashboard or `reel calendar edit` are never overwritten, and a
# deleted seed day stays deleted (tombstone). Re-seeding adds slugs the DB has never seen and (v1.2)
# refreshes seed days that were never edited, so corrected dates and sources reach them.
#
# rule:   gregorian = same Gregorian month/day every year
#         hijri     = same Hijri month/day every year, converted with the Umm al-Qura calendar (hijridate,
#                     pinned in requirements.txt). Religious dates are finally set by the Supreme Court's
#                     moon-sighting announcement and can move by a day: always re-check before posting.
#         once      = a single dated event (year required), e.g. a conference
# category: national | religious | international | tech | career
#           (national also holds Saudi-specific days that aren't holidays, e.g. Saudi Green Initiative Day)
# official: true only for days set by a Saudi royal order or Council of Ministers decision and for official
#           public holidays (Founding Day, National Day, the Eids, Arafah). Everything else is official: false,
#           including days a ministry marks every year.
# keywords: words that tag a reel as being about the day (substring match on Arabic). Keep them specific
#           («يوم التعليم», not «التعليم»), or every reel about education gets pulled into that day's window.
#
# v1.2 (researched 2026-10-15 by the researcher, reviewed by legal-compliance): every day has a source and the
# date it was checked. "Secondary" in notes = not confirmed on a primary government/organiser page: re-check
# before filming. Left out on purpose (legal-compliance ruling 2026-10-15; religious/reputational, not a
# statute, except Pride, which is also a legal risk): Mawlid, Ashura, Isra and Mi'raj, Mid-Sha'ban,
# Valentine's, Christmas, Halloween, Pride. Left out because no source could be found: Father's Day, Doctors'
# Day, a Saudi Engineers' Day, Labour Day as a Saudi occasion, Saudi-specific Teacher/Arabic/Children's days,
# the 2026/27 school calendar (third-party source only). LEAP 2027 was removed from the seed: its date is
# unconfirmed (LEAP 2026 moved to Aug-Sep); add it by hand once onegiantleap.com publishes it.
occasions:
  # ---------------------------------------------------------------- national (Saudi)
  - slug: founding-day
    name_ar: يوم التأسيس
    name_en: Founding Day
    rule: gregorian
    month: 2
    day: 22
    category: national
    official: true
    angle: Saudi tech story then and now; national pride without commercial offers.
    notes: Official holiday for the public and private sectors. Royal order A/371 of 24/6/1443H (2022-01-27) makes 22 Feb an official day every year. Secondary source (Okaz quoting the order); re-check the primary text on spa.gov.sa. Follow the national-symbols rules in the checklist.
    source_url: https://www.okaz.com.sa/news/local/2097921
    checked_on: 2026-10-15
    keywords: [يوم التاسيس, founding day]

  - slug: flag-day
    name_ar: يوم العلم
    name_en: Flag Day
    rule: gregorian
    month: 3
    day: 11
    category: national
    official: true
    angle: Respectful national-pride reel; never put the flag on merchandise, ads or the floor.
    notes: Official national occasion by royal order (A/303 of 9/8/1444H, 2023-03-01; number per Asharq Al-Awsat, secondary). The Ministry of Education page (primary) confirms 11 March and the royal order. NOT a public holiday (no holiday announcement found).
    source_url: https://www.moe.gov.sa/en/mediacenter/MOEnews/Pages/Saudi-Flag-Day.aspx
    checked_on: 2026-10-15
    keywords: [يوم العلم, flag day]

  - slug: saudi-green-initiative-day
    name_ar: يوم مبادرة السعودية الخضراء
    name_en: Saudi Green Initiative Day
    rule: gregorian
    month: 3
    day: 27
    category: national
    official: true
    angle: Green-tech and sustainability careers in the Kingdom; AI for energy and environment jobs.
    notes: Annual awareness day set by a Council of Ministers decision (March 2024; 2024-03-19 per Saudipedia, secondary). The SGI official page (primary) confirms the body, the date and the name. Not a holiday. Use only the official SGI identity, unchanged, with no CTA.
    source_url: https://sgi.gov.sa/knowledge-hub/saudi-arabia-establishes-annual-climate-action-awareness-day/
    checked_on: 2026-10-15
    keywords: [السعوديه الخضراء, green initiative day]

  - slug: national-day
    name_ar: اليوم الوطني
    name_en: Saudi National Day
    rule: gregorian
    month: 9
    day: 23
    category: national
    official: true
    angle: Vision 2030 tech careers and what young Saudis are building; no "National Day offer" CTA.
    notes: Official holiday (one day) for the public, private and non-profit sectors. Secondary source (holiday list); the primary MHRSD notice was not retrieved. Private sector - not compensated if it falls inside an Eid holiday.
    source_url: https://calendarific.com/holidays/2026/sa
    checked_on: 2026-10-15
    keywords: [اليوم الوطني, national day, اليوم الوطني السعودي]

