    notes: Official holiday. Private and non-profit sectors get 4 days from the end of work on 29 Ramadan (HRSD 2026 announcement via Gulf News, secondary); government length not verified. 1 Shawwal 1448 = 2027-03-09 (computed); set by moon sighting.
    source_url: https://gulfnews.com/world/gulf/saudi/saudi-arabia-announces-eid-al-fitr-holidays-for-private-and-non-profit-sectors-1.500462986
    checked_on: 2026-10-15
