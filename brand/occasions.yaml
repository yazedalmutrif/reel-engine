    notes: Not a holiday; no Saudi holiday announcement found for 2025 or 2026. 1 Muharram 1449 = 2027-06-06 (Umm al-Qura, computed). Low priority. Secondary source.
    source_url: https://khaleejcalculators.com/observance/saudi-arabia/hijri-new-year
    checked_on: 2026-10-15
    keywords: [راس السنه الهجريه, hijri new year]

