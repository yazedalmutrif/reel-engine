# Saudi occasions calendar: the SEED (generic, not personal, so it lives in the public brand/ folder).
# A brand pack can ship its own occasions.yaml (brand_dir wins over this file).
#
# The seed is copied into the engine's DB once (`reel calendar seed`, also on first start). After that the
# DB is the source of truth: edits from the dashboard or `reel calendar edit` are never overwritten, and a
# deleted seed day stays deleted (tombstone). Re-seeding only adds slugs the DB has never seen.
#
# rule:   gregorian = same Gregorian month/day every year
#         hijri     = same Hijri month/day every year, converted with the Umm al-Qura calendar (hijridate,
#                     pinned in requirements.txt). Religious dates are finally set by the Supreme Court's
#                     moon-sighting announcement and can move by a day: always re-check before posting.
#         once      = a single dated event (year required), e.g. a conference
# category: national | religious | international | tech | career
# official: true only for occasions set by a Saudi royal order / official holiday. International and
#           unofficial days are official: false.
# Every seeded day has a source and the date it was checked (researched 2026-10-14). Items marked
# "secondary source" were not confirmed on a primary government/organiser page: re-check before filming.
occasions:
  - slug: founding-day
    name_ar: يوم التأسيس
    name_en: Founding Day
    rule: gregorian
    month: 2
    day: 22
    category: national
    official: true
    angle: Saudi tech story then and now; national pride without commercial offers.
    notes: Official holiday (royal order 24/6/1443H, Jan 2022). Secondary source; re-check the primary text on spa.gov.sa. Follow the national-symbols rules in the brief checklist.
    source_url: https://www.akhbaar24.com/article/detail/585734
    checked_on: 2026-10-14
    keywords: [التاسيس, founding day]

  - slug: flag-day
    name_ar: يوم العلم
    name_en: Flag Day
    rule: gregorian
    month: 3
    day: 11
    category: national
    official: true
    angle: Respectful national-pride reel; never put the flag on merchandise, ads or the floor.
    notes: National occasion by royal order (2023); not a public holiday per several outlets (unverified against MHRSD for 2026).
    source_url: https://gulfnews.com/world/gulf/saudi/saudi-arabia-to-mark-flag-day-annually-on-march-11-1.1677666831363
    checked_on: 2026-10-14
    keywords: [يوم العلم, flag day]

