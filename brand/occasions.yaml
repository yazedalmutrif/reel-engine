  - slug: hajj-season
    name_ar: موسم الحج
    name_en: Hajj season (8-13 Dhu al-Hijjah)
    rule: hijri
    month: 12
    day: 8
    duration_days: 6
    category: religious
    official: false
    angle: The tech behind Hajj (apps, crowd management) with verified facts only; respectful, no entertainment tone.
    notes: Not a holiday as such. 8 Dhu al-Hijjah 1448 = 2027-05-14 to 13 Dhu al-Hijjah = 2027-05-19 (computed). Never film at the holy sites or of pilgrims; no product tie-in. Secondary source.
    source_url: https://blog.wego.com/hajj-festival/
    checked_on: 2026-10-15
    keywords: [موسم الحج, hajj season]

