    notes: Not a holiday. 21 Ramadan 1448 = 2027-02-28 (Umm al-Qura, computed; moves with the start of Ramadan). No filming in mosques or of people praying.
    source_url: https://www.ummulqura.org.sa/
    checked_on: 2026-10-15
    keywords: [العشر الاواخر, ليله القدر, last ten nights]

  - slug: eid-al-fitr
    name_ar: عيد الفطر
